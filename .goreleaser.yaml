version: 2

project_name: openarch

before:
  hooks:
    - go mod tidy

builds:
  - id: openarch
    main: ./cmd/openarch
    binary: openarch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/AlfrescoLabs/openarch-cli/internal/version.Version={{ .Version }}
      - -X github.com/AlfrescoLabs/openarch-cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/AlfrescoLabs/openarch-cli/internal/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/walkthrough.md

checksum:
  name_template: checksums.txt

# One SBOM (SPDX JSON, made by syft) per archive.
sboms:
  - artifacts: archive

# Keyless signature of checksums.txt with cosign, from the GitHub Actions OIDC identity.
# A Sigstore bundle holds the signature, the certificate and the transparency
# log proof in one file. openarch self-update checks it.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: ""
  filters:
    exclude:
      - "^Merge "

# The release is a draft: it is visible only to maintainers until someone publishes it on GitHub.
release:
  github:
    owner: AlfrescoLabs
    name: openarch-cli
  draft: true
  prerelease: auto
  name_template: "openarch {{ .Version }}"

# The tap and the bucket are shared by AlfrescoLabs tools. The release
# workflow pushes to them with one deploy key each. The keys are empty in
# snapshot mode, which writes the files to dist/ and pushes nothing.
homebrew_casks:
  - name: openarch
    repository:
      owner: AlfrescoLabs
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:AlfrescoLabs/homebrew-tap.git"
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    directory: Casks
    commit_author:
      name: Angel Borroy
      email: angel.fernandoborroy@hyland.com
    commit_msg_template: "openarch {{ .Version }}"
    homepage: https://github.com/AlfrescoLabs/openarch-cli
    description: Install and operate OpenArch with Docker Compose
    license: Apache-2.0
    generate_completions_from_executable:
      executable: openarch
      shell_parameter_format: cobra
    # The binaries have no Apple signature, so macOS would block a quarantined file.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/openarch"]
          end

scoops:
  - name: openarch
    repository:
      owner: AlfrescoLabs
      name: scoop-bucket
      branch: main
      git:
        url: "git@github.com:AlfrescoLabs/scoop-bucket.git"
        private_key: '{{ envOrDefault "SCOOP_BUCKET_DEPLOY_KEY" "" }}'
    commit_author:
      name: Angel Borroy
      email: angel.fernandoborroy@hyland.com
    commit_msg_template: "openarch {{ .Version }}"
    homepage: https://github.com/AlfrescoLabs/openarch-cli
    description: Install and operate OpenArch with Docker Compose
    license: Apache-2.0
