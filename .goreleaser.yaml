version: 2

project_name: openarch

before:
  hooks:
    - go mod tidy

builds:
  - id: openarch
    main: ./cmd/openarch
    binary: openarch
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/AlfrescoLabs/openarch-cli/internal/version.Version={{ .Version }}
      - -X github.com/AlfrescoLabs/openarch-cli/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/AlfrescoLabs/openarch-cli/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

# Publishing stays off until a release is reviewed and approved.
release:
  disable: true
