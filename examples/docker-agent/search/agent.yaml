# Docker Agent with a shell, the Agent Skills of the CLI for OpenArch, and a
# local model on Docker Model Runner. The instruction has no OpenArch facts:
# how to search as one user comes from the openarch-search skill, which run.sh
# installs with 'openarch skill install'.
models:
  local:
    provider: dmr
    model: glm-4.7-flash:31B

agents:
  root:
    model: local
    description: Assistant that answers from documents
    instruction: |
      You are an assistant with a shell. Run one command at a time.
      Every fact must come from a tool call. Never write a tool result yourself.
    skills: true
    toolsets:
      - type: shell

# run.sh uses --safety restricted, so every shell command that no rule allows
# is denied. The agent can run 'openarch ...' and nothing else: no pipes, no
# redirections and no second command.
permissions:
  allow:
    - "shell:cmd=openarch *"
  deny:
    - "shell:cmd=*;*"
    - "shell:cmd=*&*"
    - "shell:cmd=*|*"
    - "shell:cmd=*>*"
    - "shell:cmd=*<*"
    - "shell:cmd=*`*"
    - "shell:cmd=*$(*"
