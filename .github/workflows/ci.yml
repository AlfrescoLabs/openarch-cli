name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/openarch

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check that the generated API client is up to date
        run: |
          make generate
          git diff --exit-code -- internal/api/gen
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      # Signing needs the release workflow's OIDC token, so the snapshot skips it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign

  e2e:
    name: e2e (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: secure, volume
            flags: ""
          - name: secure, bind
            flags: --storage bind
            check-owners: "1"
          - name: insecure
            flags: --insecure-backends --default-users
          - name: self-signed TLS
            flags: --tls self-signed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      # OpenSearch needs this on native Linux Docker.
      - run: sudo sysctl -w vm.max_map_count=262144
      - run: test/e2e.sh bin/openarch ${{ matrix.flags }}
        env:
          E2E_CHECK_OWNERS: ${{ matrix.check-owners }}
