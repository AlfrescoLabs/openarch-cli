# Generated by openarch. OpenSearch reads this file only when its data is created.
_meta:
  type: "roles"
  config_version: 2

# OpenArch creates and manages its own indices and aliases. It cannot change
# the security configuration. Some document operations are cluster-level
# permissions that cluster_all does not include: bulk indexing (in
# cluster_composite_ops) and clearing search scrolls (indices:data/read/scroll*).
openarch_app:
  reserved: true
  cluster_permissions:
    - "cluster_all"
    - "cluster_composite_ops"
    - "indices:data/read/scroll*"
  index_permissions:
    - index_patterns:
        - "*"
      allowed_actions:
        - "indices_all"
