# OpenArch users. OpenArch reads this file at startup: after a change, run 'openarch up'.
# Passwords are bcrypt hashes. The admin password is in .env.local.
# Manage users with 'openarch users add|set-password|delete'. 'openarch render'
# keeps every user and group, and writes the admin entry from .env.local.
administratorsGroups:
  - administrators
groups:
  - id: 5324ec90-ba1e-4030-8e6a-d815c6f3d4b1
    name: administrators
  - id: 8d6542c9-50e9-4027-aa10-2cfb2179413f
    name: members
users:
  - id: 00000000-0000-0000-0000-000000000001
    username: admin
    password: '{bcrypt}$2a$10$7EqJtq98hPqEX7fNZaFWoOhi5BWX4Z3RZbQ0Lq4n3Cf8/7xQ9b7Fy'
    firstName: Admin
    lastName: User
    email: admin@example.com
    groups:
      - administrators
      - members
